# Exact host names (no leading dots); -n prevents reverse-DNS matching of IPs.
http_port 3128
acl CONNECT method CONNECT
acl TLS_port port 443
acl permitted dstdomain -n apps.inside.anl.gov pubchem.ncbi.nlm.nih.gov
acl exact_authority url_regex ^apps\.inside\.anl\.gov:443$ ^pubchem\.ncbi\.nlm\.nih\.gov:443$
acl manager proto cache_object
http_access deny manager
http_access deny !CONNECT
http_access deny !TLS_port
http_access allow permitted exact_authority
http_access deny all
cache deny all
cache_store_log none
access_log none
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
netdb_filename none
pinger_enable off
icp_port 0
htcp_port 0
via off
forwarded_for delete
shutdown_lifetime 0 seconds
