[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "chemgraph"
version = "0.6.0"
description = "A computational chemistry agent for molecular simulation tasks."
readme = "README.md"
authors = [
    { name = "Thang Pham", email = "tpham@anl.gov" },
    { name = "Murat Keçeli", email = "keceli@anl.gov" },
    { name = "Aditya Tanikanti", email = "atanikanti@anl.gov" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.5",
    "langgraph==1.2.9",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.2",
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "langchain-openai==1.4.1",
    "langchain-ollama==1.1.0",
    "langchain-anthropic==1.5.4",
    "langchain-google-genai==4.3.1",
    "langchain-groq==1.1.3",
    "langchain-mcp-adapters==0.3.0",
    "pydantic==2.13.4",
    "pandas==2.2.3",
    "pubchempy==1.0.5",
    "numpy==2.2.6",
    "numexpr==2.11.0",
    "pytest==8.4.1",
    "ase",
    "rdkit",
    "pymatgen",
    "mace-torch",
    "globus_sdk",
    "streamlit==1.48.1",
    "py3Dmol",
    "langsmith==0.10.10",
    "rich==14.1.0",
    "toml==0.10.2",
    "mcp==1.28.1",
    "fastmcp==3.4.4",
    "pytest-asyncio",
    "grandalf==0.8"
    ]

[project.optional-dependencies]
# Optical Chemical Structure Recognition: read a structure diagram, get a SMILES.
#
# All four specialists run in this environment, so none needs one of its own. Two are
# installed from forks that relax pins predating Python 3.12; the upstream pins are
# mutually unsatisfiable, so pip refuses to resolve them together. The forks change
# dependency metadata only, and chemgraph.tools.timm_compat handles the import paths
# timm moved after 0.4.12. Checkpoints are covered in examples/ocsr/README.md.
ocsr = [
    "decimer>=2.8",
    "glyph @ git+https://github.com/EdisonScientific/glyph@0bf782f863d26b041ace157668928ef07c38b972",
    "MolNexTR @ git+https://github.com/reowszer/MolNexTR@f450b9661557b1f91ae36f59dd1fadfbcb3a0967",
    "MolScribe @ git+https://github.com/reowszer/MolScribe@b03b30fbac9a78434116e626ebef6c7b7bdcdb6e",
    # Upper bound because timm_compat reaches into private modules (models._builder,
    # models._registry), which carry no stability promise across minor releases.
    "timm>=1.0,<1.1",
]
codex = [
    "openai-codex==0.144.4",
]
calculators = [
    "tblite==0.4.0; python_version < '3.13' or platform_system != 'Darwin'",
]
uma = [
    "fairchem-core==2.3.0",
    "e3nn>=0.5",
]
ui = [
    "streamlit",
    "py3Dmol",
]
parsl = [
    "parsl",
]
ensemble_launcher = [
    "ensemble-launcher",
]
globus_compute = [
    "globus-compute-sdk",
]
academy = [
    "academy-py",
    "httpx",
    "redis",
]
xanes = [
    "mp-api; python_version >= '3.11'",
    "parsl"
]
rag = [
    "faiss-cpu>=1.7.4",
    "langchain-text-splitters",
    "langchain-huggingface",
    "sentence-transformers>=2.2.2",
    "pymupdf>=1.24.0",
]
docking = [
    "meeko",
    # AutoDock Vina is required at runtime but is NOT pip-installable in practice
    # (the PyPI 'vina' builds from source and needs SWIG + Open Babel + Boost).
    # Install it from conda-forge:  conda install -c conda-forge vina
]

[project.urls]
"Homepage" = "https://github.com/argonne-lcf/ChemGraph"
"Repository" = "https://github.com/argonne-lcf/ChemGraph"

[project.scripts]
chemgraph = "chemgraph.cli:main"
chemgraph-eval = "chemgraph.eval.cli:main"

[tool.setuptools.packages.find]
where = ["src/"]

[tool.setuptools.package-data]
"chemgraph.eval" = ["data/*.json"]
# ocsr_models reads ocsr_registry.json through importlib.resources, so it has to ship.
"chemgraph.tools" = ["ocsr_registry.json"]
"chemgraph.academy.campaigns" = [
    "example-*/*.json",
    "example-*/*.jsonc",
    "example-*/data/*.json",
    "example-*/models/*",
    "example-*/prompt_profiles/*.json",
]
"chemgraph.academy.runtime.profiles" = ["*.json"]
"chemgraph.academy.runtime.templates" = ["*"]
"chemgraph.academy.dashboard" = ["static/*"]
"ui" = ["assets/*.png"]

[tool.ruff]
line-length = 88  # Match Black's default (adjust as needed)
target-version = "py311"  # Adjust based on your Python version
exclude = ["notebooks/"]  # Add files/folders to ignore

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "preserve"  # Keep existing quote style
indent-style = "space"  # Use spaces for indentation
skip-magic-trailing-comma = false  # Ensure Black-style formatting

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: marks tests as requiring LLM API access (run with --run-llm)",
    "globus_compute: marks tests requiring a live Globus Compute endpoint (run with --run-globus-compute)",
    "parsl: marks tests requiring a live Parsl deployment (run with --run-parsl)",
    "ensemble_launcher: marks tests requiring a live EnsembleLauncher deployment (run with --run-ensemble-launcher)",
    "academy: marks tests requiring Academy agent infrastructure (run with --run-academy)",
    "asyncio: marks async tests",
]
filterwarnings = [
    "ignore:Environment variable TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD detected.*:UserWarning",
    "ignore:In future, it will be an error for 'np.bool' scalars to be interpreted as an index:DeprecationWarning",
    "ignore:authlib.jose module is deprecated.*:authlib.deprecate.AuthlibDeprecationWarning",
    "ignore:`torch.jit.script` is deprecated.*:DeprecationWarning:torch.jit._script",
    "ignore:`torch.jit.load` is deprecated.*:DeprecationWarning:torch.jit._serialization",
]
