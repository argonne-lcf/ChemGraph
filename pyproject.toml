[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression support
build-backend = "setuptools.build_meta"

[project]
name = "chemgraph"
version = "0.7.0"
description = "Agentic AI for computational chemistry workflows."
readme = "README.md"
authors = [
    { name = "Thang Pham" },
    { name = "Murat Keçeli" },
    { name = "Aditya Tanikanti" }
]
maintainers = [
    { name = "Thang Pham" },
    { name = "Murat Keçeli" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "computational chemistry", "agentic AI", "LLM agents", "quantum chemistry",
    "molecular simulation", "ASE", "LangGraph",
]
# shields.io's pypi/pyversions badge and PyPI's sidebar are driven by these
# classifiers; test_package_metadata keeps them aligned with the CI matrix.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.5",
    "langgraph==1.2.11",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.4",
    "langchain==1.4.0",
    "langchain-core==1.6.1",
    "langchain-openai==1.4.1",
    "langchain-ollama==1.1.0",
    "langchain-anthropic==1.5.4",
    "langchain-google-genai==4.3.1",
    "langchain-groq==1.1.3",
    "langchain-mcp-adapters==0.3.0",
    "pydantic==2.13.4",
    "pandas==2.2.3",
    "pubchempy==1.0.5",
    "numpy==2.2.6",
    "numexpr==2.11.0",
    "pytest==9.0.3",
    "ase>=3.29.0",
    "rdkit",
    "pymatgen",
    "mace-torch>=0.3.16",
    "globus_sdk",
    "streamlit==1.54.0",
    "py3Dmol",
    "plotly",
    "langsmith==0.10.10",
    "rich==14.1.0",
    "toml==0.10.2",
    "mcp==1.28.1",
    "fastmcp==3.4.4",
    "pytest-asyncio",
    "grandalf==0.8"
    ]

[project.optional-dependencies]
test = [
    "quickjs==1.19.4",
]

# Optical Chemical Structure Recognition: read a structure diagram, get a SMILES.
#
# DECIMER and shared support packages are installable from PyPI. The three Git-only
# specialists live in requirements/ocsr-models.txt because PyPI rejects direct URL
# dependencies, including extras. See examples/ocsr/README.md for the pinned forks,
# timm compatibility shim, installation instructions, and checkpoints.
ocsr = [
    "decimer>=2.8",
    # Upper bound because timm_compat reaches into private modules (models._builder,
    # models._registry), which carry no stability promise across minor releases.
    "timm>=1.0,<1.1",
]
codex = [
    "openai-codex==0.144.4",
]
calculators = [
    "tblite==0.4.0; python_version < '3.13' or platform_system != 'Darwin'",
]
uma = [
    "fairchem-core==2.3.0",
    "e3nn>=0.5",
]
ui = [
    "streamlit",
    "py3Dmol",
    "plotly",
]
parsl = [
    "parsl",
]
ensemble_launcher = [
    "ensemble-launcher",
]
globus_compute = [
    "globus-compute-sdk",
]
academy = [
    "academy-py",
    "httpx",
    "redis",
]
xanes = [
    "mp-api; python_version >= '3.11'",
    "parsl"
]
rag = [
    "faiss-cpu>=1.7.4",
    "langchain-text-splitters",
    "langchain-huggingface",
    "sentence-transformers>=2.2.2",
    "pymupdf>=1.24.0",
]
docking = [
    "meeko",
    # AutoDock Vina is required at runtime but is NOT pip-installable in practice
    # (the PyPI 'vina' builds from source and needs SWIG + Open Babel + Boost).
    # Install it from conda-forge:  conda install -c conda-forge vina
]

[project.urls]
"Homepage" = "https://github.com/argonne-lcf/ChemGraph"
"Documentation" = "https://argonne-lcf.github.io/ChemGraph/"
"Repository" = "https://github.com/argonne-lcf/ChemGraph"
"Issues" = "https://github.com/argonne-lcf/ChemGraph/issues"

[project.scripts]
chemgraph = "chemgraph.cli:main"
chemgraph-eval = "chemgraph.eval.cli:main"

[tool.setuptools.packages.find]
where = ["src/"]

[tool.setuptools.package-data]
"chemgraph.skills" = ["*/SKILL.md", "*/references/*.md", "*/assets/*", "*/scripts/*"]
"chemgraph.eval" = ["data/*.json"]
# ocsr_models reads ocsr_registry.json through importlib.resources, so it has to ship.
"chemgraph.tools" = ["ocsr_registry.json"]
"chemgraph.academy.campaigns" = [
    "example-*/*.json",
    "example-*/*.jsonc",
    "example-*/data/*.json",
    "example-*/models/*",
    "example-*/prompt_profiles/*.json",
]
"chemgraph.academy.runtime.profiles" = ["*.json"]
"chemgraph.academy.runtime.templates" = ["*"]
"chemgraph.academy.dashboard" = ["static/*"]
"ui" = ["assets/*.png"]

[tool.ruff]
line-length = 88  # Match Black's default (adjust as needed)
target-version = "py311"  # Adjust based on your Python version
exclude = ["notebooks/"]  # Add files/folders to ignore

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "preserve"  # Keep existing quote style
indent-style = "space"  # Use spaces for indentation
skip-magic-trailing-comma = false  # Ensure Black-style formatting

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: marks tests as requiring LLM API access (run with --run-llm)",
    "globus_compute: marks tests requiring a live Globus Compute endpoint (run with --run-globus-compute)",
    "parsl: marks tests requiring a live Parsl deployment (run with --run-parsl)",
    "ensemble_launcher: marks tests requiring a live EnsembleLauncher deployment (run with --run-ensemble-launcher)",
    "academy: marks tests requiring Academy agent infrastructure (run with --run-academy)",
    "asyncio: marks async tests",
]
filterwarnings = [
    "ignore:Environment variable TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD detected.*:UserWarning",
    "ignore:In future, it will be an error for 'np.bool' scalars to be interpreted as an index:DeprecationWarning",
    "ignore:authlib.jose module is deprecated.*:authlib.deprecate.AuthlibDeprecationWarning",
    "ignore:`torch.jit.script` is deprecated.*:DeprecationWarning:torch.jit._script",
    "ignore:`torch.jit.load` is deprecated.*:DeprecationWarning:torch.jit._serialization",
]
