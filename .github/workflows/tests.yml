name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install lint dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install ruff
        python -m pip check

    - name: Run ruff
      run: |
        ruff check .

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        python -m pip check
            
    - name: Run tests
      run: |
        python -m pytest tests/ -v -k "not tblite"

  wheel-install:
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build distributions
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
        python -m build

    - name: Install and verify wheel
      run: |
        python -m pip install dist/*.whl
        python scripts/check_distribution_metadata.py dist/*
        python -c "import chemgraph; print(f'ChemGraph {chemgraph.__version__}')"
        chemgraph --help
        python -m pip check

    - name: Test extracted source distribution
      run: |
        sdist_root="$RUNNER_TEMP/chemgraph-sdist"
        mkdir -p "$sdist_root"
        tar -xzf dist/chemgraph-*.tar.gz -C "$sdist_root" --strip-components=1
        cd "$sdist_root"
        export PYTHONPATH="$sdist_root/src"
        export PYTHONNOUSERSITE=1
        python - <<'PY'
        from pathlib import Path
        import chemgraph
        import ui
        source = Path("src").resolve()
        for package in (chemgraph, ui):
            assert Path(package.__file__).resolve().is_relative_to(source)
        PY
        python -m pytest -q \
          tests/test_package_metadata.py \
          tests/test_mace_defaults.py \
          tests/test_ase_failures.py \
          tests/test_mcp.py::test_run_ase_energy_simple \
          tests/test_mcp.py::test_run_ase_thermo_simple

  # Exercises the distributed/HPC feature set: the Academy multi-agent module
  # and the parsl / globus-compute execution backends. These tests use mocks and
  # local subprocesses (no real HPC cluster, Globus endpoint, or LLM), so they
  # run in CI. Live tests remain gated behind --run-globus-compute / --run-llm
  # and are not enabled here.
  test-extras:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (academy + execution backends)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[academy,parsl,globus_compute]"
        python -m pip check

    - name: Run academy + backend tests
      run: |
        python -m pytest tests/ -v -k "not tblite"
