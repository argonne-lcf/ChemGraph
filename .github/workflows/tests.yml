name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install lint dependencies
      shell: bash
      run: |
        python -m pip install "pip==26.2.2"
        constraints="$(python scripts/ci_constraints.py path --job lint)"
        python -m pip install -c "$constraints" -e . ruff
        python -m pip check
        python scripts/ci_constraints.py check --job lint --installed

    - name: Check all CI constraint profiles
      run: python scripts/ci_constraints.py check

    - name: Run ruff
      run: |
        ruff check .

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install "pip==26.2.2"
        constraints="$(python scripts/ci_constraints.py path --job test)"
        python -m pip install -c "$constraints" -e .
        python -m pip check
        python scripts/ci_constraints.py check --job test --installed
            
    - name: Run tests
      run: |
        python -m pytest tests/ -v -k "not tblite"

  wheel-install:
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build distributions
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
        python -m build

    - name: Install and verify wheel
      run: |
        python -m pip install dist/*.whl
        python scripts/check_distribution_metadata.py dist/*
        python -c "import chemgraph; print(f'ChemGraph {chemgraph.__version__}')"
        chemgraph --help
        python -m pip check

  # Exercises the Academy multi-agent module, parsl / globus-compute execution
  # backends, and Codex SDK contracts. These tests use mocks and local
  # subprocesses (no real HPC cluster, Globus endpoint, or LLM), so they
  # run in CI. Live tests remain gated behind --run-globus-compute / --run-llm
  # and are not enabled here.
  test-extras:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (tests + academy + execution backends + codex)
      shell: bash
      run: |
        python -m pip install "pip==26.2.2"
        constraints="$(python scripts/ci_constraints.py path --job test-extras)"
        python -m pip install -c "$constraints" -e ".[test,academy,parsl,globus_compute,codex]"
        python -m pip check
        python scripts/ci_constraints.py check --job test-extras --installed

    - name: Verify QuickJS and Codex SDK are installed
      run: python -c "import quickjs; import openai_codex.generated.v2_all"

    - name: Run academy + backend + Codex tests
      run: |
        python -m pytest tests/ -v -k "not tblite"
