site_name: ChemGraph
site_description: Agentic computational chemistry workflows from the command line, Python, Streamlit, and MCP.
site_url: https://argonne-lcf.github.io/ChemGraph/
repo_name: argonne-lcf/ChemGraph
repo_url: https://github.com/argonne-lcf/ChemGraph
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/chemgraph_logo.png
  favicon: assets/chemgraph_logo.png
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Models and authentication: models.md
      - Troubleshooting: troubleshooting.md
  - Using ChemGraph:
      - Command-line interface: cli.md
      - Workflows: workflows.md
      - Tool and agent registries: registries.md
      - Calculators: calculators.md
      - Python API: python_api.md
      - Streamlit interface: streamlit_web_interface.md
      - Configuration: configuration_with_toml.md
      - Examples: example_usage.md
  - Integrations and scale:
      - MCP servers: mcp_servers.md
      - Docker: docker_support.md
      - Kubernetes: kubernetes.md
      - Local models: running_local_models.md
      - HPC and Academy: hpc_and_academy.md
  - Evaluation: evaluation.md
  - Experimental:
      - Codex subscription: codex_subscription.md
  - Project:
      - Project structure: project_structure.md
      - Contributing: contributing.md
      - Code formatting: code_formatting_and_linting.md
      - Citation: citation.md
      - Acknowledgements: acknowledgements.md
      - License: license.md
