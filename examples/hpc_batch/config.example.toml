# Copy to config.local.toml and replace every YOUR_* value. No credentials here.
# This file is loaded by run_demo.py, not automatically by the ChemGraph CLI.
[hpc]
allow_unreviewed_mutations = false

[hpc.targets.polaris]
compute_resource = "polaris"
storage_resource = "eagle"
project = "YOUR_PROJECT"
queue = "debug"
local_collection = "YOUR_LOCAL_COLLECTION_UUID"
remote_collection = "YOUR_REMOTE_COLLECTION_UUID"

# The same directory as seen by the submitting host and its Globus collection.
local_root = "/absolute/path/to/YOUR_LOCAL_RUNS"
local_collection_root = "/absolute/path/to/YOUR_LOCAL_RUNS"
# The same directory as seen by compute nodes and the remote Globus collection.
# Collection paths may omit the /lus/eagle/projects prefix. Verify both views.
remote_root = "/lus/eagle/projects/YOUR_PROJECT/YOUR_USER/chemgraph-demo"
remote_collection_root = "/YOUR_PROJECT/YOUR_USER/chemgraph-demo"

[hpc.targets.polaris.resources]
node_count = 1
duration = 300  # seconds; five minutes is the Polaris debug minimum
filesystems = "home:eagle"
